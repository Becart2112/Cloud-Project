<!DOCTYPE html>
<html>
<head>
    <title>Document Manager</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        input[type="file"], button { padding: 10px; margin: 10px 0; }
        #docs { margin-top: 20px; }
        .doc-item { border: 1px solid #ccc; padding: 10px; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Document Manager</h1>
        
        <div>
            <h2>Upload Document</h2>
            <input type="file" id="fileInput">
            <button onclick="uploadFile()">Upload</button>
            <p id="status"></p>
        </div>
        
        <div id="docs">
            <h2>Documents</h2>
            <button onclick="loadDocuments()">Refresh</button>
            <div id="docsList"></div>
        </div>
    </div>

    <script>
        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const resp = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await resp.json();
                document.getElementById('status').innerText = data.message || data.error;
                loadDocuments();
            } catch (e) {
                document.getElementById('status').innerText = 'Error: ' + e.message;
            }
        }
        
        async function loadDocuments() {
            try {
                const resp = await fetch('/api/documents');
                const docs = await resp.json();
                const html = docs.map(d => `
                    <div class="doc-item">
                        <strong>${d.originalName}</strong><br>
                        Uploaded: ${new Date(d.uploadDate).toLocaleString()}<br>
                        Size: ${(d.fileSize / 1024).toFixed(2)} KB
                    </div>
                `).join('');
                document.getElementById('docsList').innerHTML = html || 'No documents';
            } catch (e) {
                document.getElementById('docsList').innerHTML = 'Error loading documents';
            }
        }
        
        loadDocuments();
    </script>
</body>
</html>
