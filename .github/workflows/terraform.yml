# .github/workflows/app_deploy.yml
name: 'Application Code Deployment'

on:
  push:
    branches:
      - main
    paths:
      - 'src/azure_function/**'
  workflow_run:
    workflows: ['Terraform Infrastructure Deployment']
    branches: [main]
    types: [completed]
      
jobs:
  build_and_deploy_function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 'Login via Azure CLI'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Download tf outputs
        uses: actions/download-artifact@v4
        with:
          name: tf-outputs
          path: ./outputs

      - name: Extract app name
        id: extract
        run: |
          APP_NAME=$(jq -r '.function_app_name.value' ./outputs/tf_outputs.json)
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          
      - name: 'Deploy Azure Function'
        uses: azure/functions-action@v1
        with:
          app-name: ${{ steps.extract.outputs.app_name }}
          package: './src/azure_function' 
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}